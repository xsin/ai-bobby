name: Release (ad-hoc signing)

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Read version
        id: ver
        run: |
          V="$(node scripts/release/version.mjs)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Build and package arm64
        env:
          SIGN_IDENTITY: "-"
          AI_BOBBY_RELEASE_NOTES: "AI Bobby 0.2.5：开发版与线上版隔离（46891 / AI Bobby Dev / dev 导入命名空间）、WorkBuddy 账号拖动排序、托盘图标裁剪、About 文案与 i18n 收尾。"
        run: |
          bash scripts/release/build-mac.sh \
            --arch arm64 \
            --out-dir "$RUNNER_TEMP/dist/${{ steps.ver.outputs.version }}"

      - name: Build and package x64
        env:
          SIGN_IDENTITY: "-"
          AI_BOBBY_RELEASE_NOTES: "AI Bobby 0.2.5：开发版与线上版隔离（46891 / AI Bobby Dev / dev 导入命名空间）、WorkBuddy 账号拖动排序、托盘图标裁剪、About 文案与 i18n 收尾。"
        run: |
          bash scripts/release/build-mac.sh \
            --arch x64 \
            --out-dir "$RUNNER_TEMP/dist/${{ steps.ver.outputs.version }}"

      - name: Verify signatures of shipped zips
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          V="${{ steps.ver.outputs.version }}"
          for arch in arm64 x64; do
            rm -rf verify && mkdir verify
            ditto -x -k "dist/$V/AI-Bobby-$V-$arch.zip" verify/
            codesign --verify --deep --strict --verbose=2 "verify/AI Bobby.app"
          done

      - name: Validate release manifest
        run: node scripts/release/validate.mjs "$RUNNER_TEMP/dist/${{ steps.ver.outputs.version }}"

      - name: Update Pages install channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SITE="$RUNNER_TEMP/site"
          ROOT="$GITHUB_WORKSPACE"
          DIST="$RUNNER_TEMP/dist/$V"

          rm -rf "$SITE"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone -q --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$SITE"
          else
            mkdir -p "$SITE"
            cd "$SITE"
            git init -q
            git checkout -q -b gh-pages
            cd - >/dev/null
          fi

          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Root is owned by website.yml. Only replace the install channel;
          # never overwrite the landing page index.html.
          rm -rf website
          rm -rf releases/latest
          mkdir -p releases/latest
          cp "$ROOT/scripts/release/install.sh" releases/latest/install.sh
          cp "$DIST/checksums.txt" releases/latest/checksums.txt
          cp "$DIST/latest.json" releases/latest/latest.json
          cp "$DIST/VERSION.txt" releases/latest/VERSION.txt
          if [ ! -f index.html ]; then
            cp "$ROOT/scripts/release/pages/index.html" index.html
          fi
          touch .nojekyll

          git add -A
          git commit -q -m "release: AI Bobby ${{ steps.ver.outputs.version }} install channel" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "updated install channel without touching landing page"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          DIST="$RUNNER_TEMP/dist/$V"

          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y || true

          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "公测版：ad-hoc 签名分发，未经 Apple 公证。"
            echo ""
            echo "**安装（推荐）**"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://xsin.github.io/ai-bobby/releases/latest/install.sh | bash"
            echo '```'
            echo ""
            echo "二进制由 GitHub Release 托管（gh-pages 只放安装脚本与更新清单）。"
            echo ""
            echo "首次打开若被 Gatekeeper 阻止，请右键 → 打开，或执行："
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/AIMatrix/AI Bobby.app"'
            echo '```'
          } > "$NOTES"

          gh release create "$TAG" --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI Bobby ${V}" \
            --notes-file "$NOTES" \
            --generate-notes

          for f in "$DIST"/*; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          cp scripts/release/install.sh "$RUNNER_TEMP/install.sh"
          gh release upload "$TAG" "$RUNNER_TEMP/install.sh" --clobber
