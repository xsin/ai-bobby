name: Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @ai-bobby/website typecheck

      - name: Test
        run: pnpm --filter @ai-bobby/website test

      - name: Build
        run: pnpm --filter @ai-bobby/website build

      - name: Deploy to gh-pages root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/gh-pages"
          rm -rf "$SITE"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone -q --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$SITE"
          else
            mkdir -p "$SITE"
            cd "$SITE"
            git init -q
            git checkout -q -b gh-pages
            cd - >/dev/null
          fi

          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Root now serves the landing page; keep /releases/latest intact.
          rm -rf website
          cp -R "$GITHUB_WORKSPACE/apps/website/dist/." .
          touch .nojekyll
          git add -A
          git commit -q -m "site: deploy AI Bobby landing page" || true
          git push origin HEAD:gh-pages
          echo "published landing page to gh-pages root"
